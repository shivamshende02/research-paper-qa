
[project]
name = "research-paper-qa"
version = "0.1.0"
description = "Research paper question-answering system using RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "sentence-transformers==6.2.0",
    "python-dotenv>=1.2.4",
    "fastapi>=0.162.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "marker-pdf>=2.1.0",
    "aiofiles>=25.1.0",
    "pymupdf>=1.28.2",
    "sqlalchemy>=2.0.57",
    "psycopg[binary]>=3.3.8",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "celery>=5.7.0",
    "pydantic-settings>=2.15.0",
    "groq>=1.7.0",
    "qdrant-client>=1.16,<1.18",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "einops>=0.8.2",
    "mistralai>=3.7.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
